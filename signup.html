<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" />
    <title>MeowSpace - Cadastro</title>
</head>
<body>
    <div id="wrapper">
        <div id="container-signup">
            <div class="column right">
                <div class="login-panel">
                    <div class="logo">
                        <img class="logo-img" src="images/logo.png" alt="Logo do MeowSpace">
                    </div>

                    <div class="message">
                        <span>Cadastre-se para ver fotos e vídeos dos seus amigos.</span>
                    </div>

                    <form>
                        <input placeholder="Nome completo" type="text" name="name"/>
                        <input placeholder="Email" type="email" name="email"/>
                        <input placeholder="Telefone" type="text" name="phone"/>
                        <input placeholder="Senha" type="password" name="password"/>
                        <input placeholder="Confirme sua senha" type="password" name="confirmPassword"/>
                        <button type="submit" class="cta-button">Cadastrar</button>
                    </form>

                    <div class="divisor-container">
                        <div class="line"></div>
                        <div class="divisor-tag">OU</div>
                        <div class="line"></div>
                    </div>

                    <div class="infobox">
                        <p>Já tem uma conta? <a href="index.html">Entrar</a></p>
                    </div>
                </div>

                <div class="get-app-panel">
                    Obtenha o aplicativo.
                    <div class="app-buttons">
                        <a href="#">
                            <img src="images/app store.jpg" alt="Baixe na appStore">
                        </a>
                        <a href="#">
                            <img src="images/play store.png" alt="Baixe na GooglePlay">
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <div class="footer-inner">
                <a href="#">About us</a>
                <a href="#">Support</a>
                <a href="#">Blog</a>
                <a href="#">Press</a>
                <a href="#">API</a>
                <a href="#">Jobs</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
                <a href="#">Directory</a>
                <a href="#">Profiles</a>
                <a href="#">Hashtags</a>
                <a href="#">Language</a>
                <a href="#">2025 Instagram</a>
            </div>
        </footer>
    </div>

    <script src="signup.js"></script>
</body>
</html>
